name: Build and Deploy

on:
  push:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      # 手动管理 pnpm store 缓存以启用增量复用
      # setup-node 的 package-manager-cache 不支持 restore-keys，
      # 导致依赖更新时 cache key 变化，必须全部重新下载。
      # 使用 restore-keys 可以复用旧缓存，pnpm 只需增量下载变更的包。
      - name: Get pnpm store path
        run: echo PNPM_STORE_PATH=$(pnpm store path --silent) >> "$GITHUB_ENV"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-cache-production-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-cache-production-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .astro
            .cache
          key: astro-build-${{ github.sha }}
          restore-keys: astro-build-

      - run: pnpm install --frozen-lockfile --production

      # Use build:full when commit title (first line) contains [full]
      - name: Detect [full] in commit title
        run: |
          if git log -1 --pretty=%s | grep -q '\[full\]'; then
            echo "BUILD_CMD=pnpm build:full" >> $GITHUB_ENV
          else
            echo "BUILD_CMD=pnpm build" >> $GITHUB_ENV
          fi

      - run: ${{ env.BUILD_CMD }}

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: cloudflare_workers
        run: pnpm online:workers
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: cloudflare_pages
        run: pnpm online:pages
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

      - name: Prune pnpm store
        run: pnpm store prune

      - name: Exit with error if any step failed
        if: |
          steps.cloudflare_workers.outcome != 'success' || steps.cloudflare_pages.outcome != 'success'
        run: exit 1
